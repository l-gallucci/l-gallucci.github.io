lede: "A small home for the things I build and the pictures I keep coming back to."

code:
  lede: "Small games, utilities, experiments, and code sketches that do not quite belong in the research page."
  projects:
    - id: "hydrogen-planet"
      title: "Hydrogen Planet"
      type: "Quiz game"
      status: "Released"
      stack: "JavaScript, CSS, HTML"
      description: "A quiz game about field-work research on our planet with a focus on hydrogen. The game is designed for educational (+10)purposes and aims to raise awareness about the importance of hydrogen in our environment."
      links:
        demo: "https://l-gallucci.github.io/hydrogen-planet/"
        github: "https://github.com/l-gallucci/hydrogen-planet"

